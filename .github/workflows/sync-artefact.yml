name: Sync Artefact Data - v1.5

on:
  # Run on the 1st, 2nd, and 3rd of every month at 00:00 UTC
  schedule:
    - cron: '0 0 1-3 * *'
  
  # Allow manual trigger
  workflow_dispatch:

permissions:
  contents: write  # Allow the workflow to push commits and sync branches
  pull-requests: write  # Allow the workflow to open and merge the sync PR
  actions: write  # Allow the workflow to start CI on a sync branch and wait for it

env:
  SYNC_ARTIFACT_VERSION: "1.5"

jobs:
  sync-artefact:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Pin to master: the sync must land on the prod branch. `github.ref`
          # follows the branch picked in the manual-trigger dropdown, and a
          # manual run from `development` would commit to dev and skip master.
          ref: master
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Print workflow version
        run: echo "Running sync-artefact version $SYNC_ARTIFACT_VERSION"

      - name: Run artifact sync script
        run: npm run sync-artefact
      
      - name: Check for changes
        id: git-check
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Commit changes
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: Sync artefact data from SFL repo [$(date +'%Y-%m-%d')]"
      
      - name: No changes detected
        if: steps.git-check.outputs.changed != 'true'
        run: echo "No season updates detected. Everything is up to date!"

      - name: Open and merge PR to master
        if: steps.git-check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # master requires PRs (repo ruleset "no direct pushses").
          BRANCH="sync-artefact-${{ github.run_id }}"
          git push origin "HEAD:refs/heads/$BRANCH"
          PR_URL=$(gh pr create --base master --head "$BRANCH" \
            --title "🤖 Sync artefact data [$(date +'%Y-%m-%d')]" \
            --body "Automated sync from the Sync Artefact Data workflow. Data-only change to \`src/data/game/\` + \`public/world/\`.")
          echo "PR created: $PR_URL"
          # GITHUB_TOKEN events do not start workflows, so CI is started on this
          # branch explicitly. The merge runs only if that CI run passes.
          gh workflow run ci.yml --ref "$BRANCH"
          RUN_ID=""
          for i in $(seq 1 30); do
            RUN_ID=$(gh run list --workflow ci.yml --branch "$BRANCH" --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // empty')
            [ -n "$RUN_ID" ] && break
            sleep 5
          done
          if [ -z "$RUN_ID" ]; then echo "::error::No CI run started for $BRANCH"; exit 1; fi
          gh run watch "$RUN_ID" --exit-status
          gh pr merge "$PR_URL" --merge --delete-branch
          echo "✅ Master updated via PR $PR_URL"

      - name: Mirror data files to development branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin development
          SYNC_SHA=$(git rev-parse HEAD)
          # If dev's data already matches the sync commit, nothing to do. This
          # avoids false-positive guard skips when dev holds mirror commits
          # with identical content (e.g. a date-stamp refresh).
          if git diff --quiet origin/development "$SYNC_SHA" -- src/data/game/ public/world/; then
            echo "development data already up to date"
            exit 0
          fi
          # Guard: never overwrite local dev edits to data files. If development
          # has commits touching these paths that master doesn't, skip + warn.
          if [ -n "$(git log "$SYNC_SHA"..origin/development --oneline -- src/data/game/ public/world/)" ]; then
            echo "::warning::development has local changes under src/data/game/ or public/world/ not on master - skipping mirror"
            exit 0
          fi
          git checkout -B sync-dev origin/development
          git checkout "$SYNC_SHA" -- src/data/game/ public/world/
          if ! git diff --cached --quiet; then
            git commit -m "🤖 Mirror artefact data from master ($(git rev-parse --short "$SYNC_SHA"))"
            # development requires PRs, so the mirror goes through a PR like master does.
            BRANCH="sync-dev-${{ github.run_id }}"
            git push origin "sync-dev:refs/heads/$BRANCH"
            PR_URL=$(gh pr create --base development --head "$BRANCH" \
              --title "🤖 Mirror artefact data from master ($(git rev-parse --short "$SYNC_SHA"))" \
              --body "Mirror of master's artefact data. Data-only change to \`src/data/game/\` + \`public/world/\`.")
            echo "PR created: $PR_URL"
            # GITHUB_TOKEN events do not start workflows, so CI is started on this
            # branch explicitly. The merge runs only if that CI run passes.
            gh workflow run ci.yml --ref "$BRANCH"
            RUN_ID=""
            for i in $(seq 1 30); do
              RUN_ID=$(gh run list --workflow ci.yml --branch "$BRANCH" --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // empty')
              [ -n "$RUN_ID" ] && break
              sleep 5
            done
            if [ -z "$RUN_ID" ]; then echo "::error::No CI run started for $BRANCH"; exit 1; fi
            gh run watch "$RUN_ID" --exit-status
            gh pr merge "$PR_URL" --merge --delete-branch
          else
            echo "development data already up to date"
          fi



